name: Red-XAI iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to upload
        required: true
        type: choice
        options: [database, host]
permissions:
  contents: read
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: NZPU8H843J
      ASC_KEY_ID: 2184BZOB7XYB
      ASC_ISSUER_ID: af0c0450-10f2-4027-b34d-5356dfc53f5c
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify App Store Connect secret
        shell: bash
        run: |
          test -n "$ASC_PRIVATE_KEY_P8" || { echo "::error::ASC_PRIVATE_KEY_P8 is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build and test simulator targets
        working-directory: ios
        run: |
          xcodebuild -project RedXAIiOS.xcodeproj -scheme RedXAIDatabase -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project RedXAIiOS.xcodeproj -scheme RedXAIHost -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Select target
        id: app
        shell: bash
        run: |
          if [ "${{ inputs.app }}" = database ]; then
            echo "scheme=RedXAIDatabase" >> "$GITHUB_OUTPUT"
            echo "bundle=com.redxai.database" >> "$GITHUB_OUTPUT"
          else
            echo "scheme=RedXAIHost" >> "$GITHUB_OUTPUT"
            echo "bundle=com.redxai.host" >> "$GITHUB_OUTPUT"
          fi
      - name: Archive using Apple automatic signing
        working-directory: ios
        run: |
          xcodebuild -project RedXAIiOS.xcodeproj             -scheme "${{ steps.app.outputs.scheme }}"             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/app.xcarchive"             -allowProvisioningUpdates             -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"             -authenticationKeyID "$ASC_KEY_ID"             -authenticationKeyIssuerID "$ASC_ISSUER_ID"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Automatic             archive
      - name: Export and upload to App Store Connect
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/app.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"             -authenticationKeyID "$ASC_KEY_ID"             -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --p8-file-path "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/app.xcarchive" "$RUNNER_TEMP/export"
