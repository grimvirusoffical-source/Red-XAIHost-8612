name: Red-XAI iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to upload
        required: true
        type: choice
        options: [database, host, both]
        default: both
  push:
    branches: [main]
    paths: [".testflight-trigger", ".testflight-trigger2"]
permissions:
  contents: read
concurrency:
  group: redxai-ios-testflight
  cancel-in-progress: false
jobs:
  testflight:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.app != 'both' && format('["{0}"]', inputs.app) || '["database","host"]') }}
    runs-on: macos-15
    environment: Apple/AndroidAccsess
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: NZPU8H843J
      ASC_KEY_ID: 8L986HWCXB
      ASC_ISSUER_ID: af0c0450-10f2-4027-b34d-5356dfc53f5c
      SELECTED_APP: ${{ matrix.app }}
      RX_EXPECTED_VERSION: 0.2.1
    steps:
      - name: Checkout verified mobile source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dace1ee6666068f7b430d41d75f263e1eea3c11b
          persist-credentials: false
      - name: Set unique release build number
        shell: bash
        run: |
          BUILD_NUMBER="$((3000 + GITHUB_RUN_NUMBER)).$GITHUB_RUN_ATTEMPT"
          echo "RX_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: $RX_EXPECTED_VERSION ($BUILD_NUMBER) / $SELECTED_APP" >> "$GITHUB_STEP_SUMMARY"
      - name: Select installed stable Xcode 26 or newer
        shell: bash
        run: |
          python3 <<'PY'
          import glob, os, plistlib, re
          candidates = []
          for path in glob.glob('/Applications/Xcode*.app'):
              if 'beta' in path.lower():
                  continue
              try:
                  with open(path + '/Contents/Info.plist', 'rb') as stream:
                      version = str(plistlib.load(stream)['CFBundleShortVersionString'])
                  if not re.fullmatch(r'\d+(\.\d+)*', version):
                      continue
                  parts = tuple(int(p) for p in version.split('.'))
                  if parts[0] >= 26:
                      candidates.append((parts, path))
              except (OSError, KeyError, ValueError):
                  continue
          if not candidates:
              raise SystemExit('No installed stable Xcode 26+ toolchain is available on this runner.')
          _, selected = max(candidates)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('DEVELOPER_DIR=' + selected + '/Contents/Developer\n')
          print('Selected ' + selected)
          PY
      - name: Verify upload SDK
        shell: bash
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhoneOS SDK: $SDK"
          test "${SDK%%.*}" -ge 26
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build both simulator apps
        working-directory: ios
        run: |
          xcodebuild -project RedXAIiOS.xcodeproj -scheme RedXAIDatabase -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project RedXAIiOS.xcodeproj -scheme RedXAIHost -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run shared XCTest suite
        working-directory: ios
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          DEVICE=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); ids=[v["udid"] for k,a in d["devices"].items() if ".iOS-" in k for v in a if v.get("isAvailable") and v["name"].startswith("iPhone")]; print(ids[0] if ids else "")' "$RUNNER_TEMP/devices.json")
          test -n "$DEVICE" || { echo '::error::No available iPhone simulator.'; exit 1; }
          xcodebuild -project RedXAIiOS.xcodeproj -scheme RedXAIDatabase -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test
      - name: Select target
        id: app
        shell: bash
        run: |
          if [ "$SELECTED_APP" = database ]; then
            echo 'scheme=RedXAIDatabase' >> "$GITHUB_OUTPUT"
          else
            echo 'scheme=RedXAIHost' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare private key from protected environment
        env:
          PRIVATE_KEY_INPUT: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createPrivateKey} from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          try {
            let value = (process.env.PRIVATE_KEY_INPUT || '').trim();
            if (!value || value.length > 65536) throw new Error();
            try { const j=JSON.parse(value); value=typeof j==='string'?j:(j.private_key || j.key || value); } catch {}
            value=value.replace(/^\uFEFF/,'').replace(/\\r\\n/g,'\n').replace(/\\n/g,'\n').replace(/\r\n/g,'\n');
            if (!value.includes('-----BEGIN')) value=Buffer.from(value.replace(/\s/g,''),'base64').toString('utf8');
            const key=createPrivateKey(value);
            if(key.asymmetricKeyType!=='ec'||key.asymmetricKeyDetails?.namedCurve!=='prime256v1') throw new Error();
            const dir=path.join(process.env.RUNNER_TEMP,'asc');
            fs.mkdirSync(dir,{recursive:true,mode:0o700});
            fs.writeFileSync(path.join(dir,`AuthKey_${process.env.ASC_KEY_ID}.p8`),key.export({type:'pkcs8',format:'pem'}),{mode:0o600});
            console.log('Private key format validated; credential contents are not logged.');
          } catch {
            console.error('::error::The protected Apple private-key value could not be parsed.');
            process.exitCode=1;
          }
          NODE
      - name: Create ephemeral App Store signing identity
        shell: bash
        run: |
          node scripts/redxai/ios_ephemeral_signing.mjs prepare
          openssl x509 -inform DER -in "$RUNNER_TEMP/signing/distribution.cer" -out "$RUNNER_TEMP/signing/distribution.pem"
          security create-keychain -p redxai-ci "$RUNNER_TEMP/redxai-ci.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/redxai-ci.keychain-db"
          security unlock-keychain -p redxai-ci "$RUNNER_TEMP/redxai-ci.keychain-db"
          security import "$RUNNER_TEMP/signing/distribution.key" -k "$RUNNER_TEMP/redxai-ci.keychain-db" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/signing/distribution.pem" -k "$RUNNER_TEMP/redxai-ci.keychain-db" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$RUNNER_TEMP/redxai-ci.keychain-db" login.keychain-db
          security default-keychain -d user -s "$RUNNER_TEMP/redxai-ci.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k redxai-ci "$RUNNER_TEMP/redxai-ci.keychain-db" >/dev/null
          security find-identity -v -p codesigning "$RUNNER_TEMP/redxai-ci.keychain-db"
      - name: Archive selected app with ephemeral distribution signing
        working-directory: ios
        shell: bash
        run: |
          xcodebuild -project RedXAIiOS.xcodeproj \
            -scheme '${{ steps.app.outputs.scheme }}' \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$RX_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$RX_BUILD_NUMBER" archive
      - name: Verify archived app identity and version
        shell: bash
        run: |
          python3 <<'PY'
          import glob, os, plistlib
          files = glob.glob(os.environ['RUNNER_TEMP'] + '/app.xcarchive/Products/Applications/*.app/Info.plist')
          if len(files) != 1:
              raise SystemExit('Expected exactly one archived app.')
          with open(files[0], 'rb') as stream:
              info = plistlib.load(stream)
          expected = {'CFBundleIdentifier': os.environ['RX_BUNDLE_ID'], 'CFBundleShortVersionString': os.environ['RX_EXPECTED_VERSION'], 'CFBundleVersion': os.environ['RX_BUILD_NUMBER']}
          for key, value in expected.items():
              if str(info.get(key, '')) != value:
                  raise SystemExit('Archive identity/version mismatch: ' + key)
          print('Archive verified:', expected)
          PY
      - name: Export and upload engineering build to App Store Connect
        shell: bash
        run: |
          python3 <<'PY'
          import os, plistlib
          options={'method':'app-store-connect','destination':'upload','signingStyle':'manual','signingCertificate':'Apple Distribution','teamID':os.environ['APPLE_TEAM_ID'],'uploadSymbols':True,'manageAppVersionAndBuildNumber':False,'provisioningProfiles':{os.environ['RX_BUNDLE_ID']:os.environ['RX_PROFILE_NAME']}}
          with open(os.environ['RUNNER_TEMP']+'/ExportOptions.plist','wb') as stream:
              plistlib.dump(options,stream)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo 'Upload command completed. App Store Connect processing and tester access must be verified separately.' >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke ephemeral signing resources
        if: always()
        run: node scripts/redxai/ios_ephemeral_signing.mjs cleanup || true
      - name: Remove temporary signing and build files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/redxai-ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/signing" "$RUNNER_TEMP/app.xcarchive" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/devices.json" "$RUNNER_TEMP/redxai-signing-state.json"
