name: Red-XAI Database CI Diagnostics
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Failed native CI job ID
        type: string
        default: '109720411099'
  push:
    branches: [main]
    paths: ['.github/workflows/redxai-db-ci-diagnostics.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize failures with bounded interaction context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: ${{ inputs.job_id || '109720411099' }}
        shell: bash
        run: |
          python3 <<'PY'
          import os, re, urllib.request, urllib.error
          job = os.environ['JOB_ID']
          if not re.fullmatch(r'[0-9]{1,20}', job):
              raise SystemExit('Invalid job ID')
          url = 'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/actions/jobs/' + job + '/logs'
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected:
                      redirected.remove_header('Authorization')
                  return redirected
          request = urllib.request.Request(url, headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.build_opener(SafeRedirect()).open(request, timeout=45) as response:
                  raw = response.read(40 * 1024 * 1024 + 1)
          except urllib.error.HTTPError as error:
              raise SystemExit('Log retrieval failed with HTTP ' + str(error.code))
          if len(raw) > 40 * 1024 * 1024:
              raise SystemExit('Log exceeds diagnostic safety limit')
          lines = raw.decode('utf-8', errors='replace').splitlines()
          failures = [i for i,line in enumerate(lines) if 'error:' in line]
          chosen = set()
          for index in failures[-3:]:
              chosen.update(range(max(0,index-95), min(len(lines),index+8)))
          chosen.update(i for i,line in enumerate(lines) if re.search(r'Executed \d+|\*\* TEST|\*\* BUILD',line))
          output = '\n'.join(lines[i][:1000] for i in sorted(chosen))[-24000:]
          output = re.sub(r'(?:github_pat_|gh[pousr]_)[A-Za-z0-9_]+', '[REDACTED]', output)
          print('SOURCE JOB: ' + job)
          print(output or 'No matching failure lines; inspect retained xcresult reports.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Database CI diagnostics\n\nSource job: ' + job + '\n\n```text\n' + output.replace('```', "'''") + '\n```\n')
          PY
