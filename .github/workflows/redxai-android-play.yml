name: Red-XAI Android Internal Testing
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to upload
        required: true
        type: choice
        options: [database, host]
permissions:
  contents: read
jobs:
  internal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Require Play and signing secrets
        shell: bash
        env:
          PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for n in PLAY KS KSP KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!n}" ]; then echo "::error::Missing required Android publishing secret ($n)"; exit 1; fi
          done
      - name: Materialize ephemeral signing files
        shell: bash
        env:
          PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$PLAY" > "$RUNNER_TEMP/play.json"
          printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Build selected release AAB
        working-directory: android
        env:
          REDXAI_KEYSTORE: ${{ runner.temp }}/upload.jks
          REDXAI_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          REDXAI_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          REDXAI_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.app }}" = database ]; then gradle :database:bundleRelease; else gradle :host:bundleRelease; fi
      - name: Upload to Google Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play.json
          packageName: ${{ inputs.app == 'database' && 'com.redxai.database' || 'com.redxai.host' }}
          releaseFiles: android/${{ inputs.app }}/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/play.json" "$RUNNER_TEMP/upload.jks"
