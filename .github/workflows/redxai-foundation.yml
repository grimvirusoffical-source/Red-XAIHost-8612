name: Red-XAI Native Foundation Preview
on:
  push:
    branches: [red-xai-foundation-v0.2]
    paths: ['foundation-source/manifest.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redxai-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/red-xai-foundation-v0.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and expand source bundle
        run: python foundation-source/unpack.py
      - name: Install test dependencies
        run: python -m pip install -r foundation/requirements-dev.txt
      - name: Run actual unit and API tests
        working-directory: foundation
        run: python -m pytest -q --junitxml=../unit-tests.xml
      - name: Commit readable expanded source on the isolated branch
        id: commit
        shell: bash
        run: |
          git config user.name 'Red-XAI Build'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add foundation
          if ! git diff --cached --quiet; then
            git commit -m 'Expand verified Red-XAI foundation source'
            git push origin HEAD:refs/heads/red-xai-foundation-v0.2
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Red-XAI-Linux-unit-evidence
          path: unit-tests.xml
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
          - os: macos-15
            label: macOS-Apple-Silicon
          - os: macos-15-intel
            label: macOS-Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install -r foundation/requirements-dev.txt
      - name: Test native platform behavior
        working-directory: foundation
        run: python -m pytest -q --junitxml=native-unit-tests.xml
      - name: Build four desktop products and probe frozen local services
        working-directory: foundation
        run: python tools/build_desktop.py --product all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Red-XAI-${{ matrix.label }}-v0.2.0-preview
          path: |
            foundation/dist/*.zip
            foundation/dist/build-evidence.json
            foundation/native-unit-tests.xml
          if-no-files-found: warn
