name: Red-XAI iOS Ad Hoc
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        required: true
        type: choice
        options: [database, host]
      device_udid:
        description: Registered iPhone UDID
        required: true
        type: string
permissions:
  contents: read
jobs:
  adhoc:
    runs-on: macos-26
    environment: Apple/AndroidAccsess
    env:
      APPLE_TEAM_ID: NZPU8H843J
      ASC_KEY_ID: 8L986HWCXB
      ASC_ISSUER_ID: af0c0450-10f2-4027-b34d-5356dfc53f5c
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 || secrets.ASC_PRIVATE }}
      SELECTED_APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: red-xai-mobile-v0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Prepare App Store Connect key
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const raw=process.env.ASC_PRIVATE_KEY_P8||'';
          const candidates=[raw,Buffer.from(raw,'base64').toString('utf8')].map(x=>x.replace(/\\n/g,'\n').trim()).filter(Boolean);
          const pem=candidates.find(x=>{try{crypto.createPrivateKey(x);return true}catch{return false}});
          if(!pem)process.exit(1);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'asc',`AuthKey_${process.env.ASC_KEY_ID}.p8`),pem+'\n',{mode:0o600});
          NODE
      - name: Register device and create Ad Hoc signing
        shell: bash
        run: |
          node scripts/redxai/ios_adhoc_signing.mjs prepare "${{ inputs.device_udid }}"
          openssl x509 -inform DER -in "$RUNNER_TEMP/signing/distribution.cer" -out "$RUNNER_TEMP/signing/distribution.pem"
          security create-keychain -p redxai-ci "$RUNNER_TEMP/redxai-ci.keychain-db"
          security unlock-keychain -p redxai-ci "$RUNNER_TEMP/redxai-ci.keychain-db"
          security import "$RUNNER_TEMP/signing/distribution.key" -k "$RUNNER_TEMP/redxai-ci.keychain-db" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/signing/distribution.pem" -k "$RUNNER_TEMP/redxai-ci.keychain-db" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$RUNNER_TEMP/redxai-ci.keychain-db" login.keychain-db
          security default-keychain -d user -s "$RUNNER_TEMP/redxai-ci.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k redxai-ci "$RUNNER_TEMP/redxai-ci.keychain-db" >/dev/null
      - name: Archive
        working-directory: ios
        shell: bash
        run: |
          if [ "$SELECTED_APP" = database ]; then SCHEME=RedXAIDatabase; else SCHEME=RedXAIHost; fi
          xcodebuild -project RedXAIiOS.xcodeproj -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$RX_PROFILE_NAME" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
      - name: Export IPA
        shell: bash
        run: |
          python3 - <<'PY'
          import os,plistlib
          p={'method':'ad-hoc','destination':'export','signingStyle':'manual','signingCertificate':'Apple Distribution','teamID':os.environ['APPLE_TEAM_ID'],'provisioningProfiles':{os.environ['RX_BUNDLE_ID']:os.environ['RX_PROFILE_NAME']}}
          plistlib.dump(p,open(os.path.join(os.environ['RUNNER_TEMP'],'ExportOptions.plist'),'wb'))
          PY
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Red-XAI-${{ inputs.app }}-AdHoc
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
      - name: Cleanup Apple signing
        if: always()
        run: |
          node scripts/redxai/ios_adhoc_signing.mjs cleanup || true
          security delete-keychain "$RUNNER_TEMP/redxai-ci.keychain-db" 2>/dev/null || true
