name: Red-XAI Database TestFlight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/redxai-database-testflight.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: redxai-ios-testflight
  cancel-in-progress: false
env:
  RX_SOURCE_SHA: 098152bf29b4746d92ce05a823da1a84408627c8
  RX_CI_RUN: '36665910991'
  RX_EXPECTED_VERSION: 0.4.0
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Require passing native build, core tests and UI durability tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import os,json,time,urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: return json.load(response)
          for attempt in range(40):
              run=get('/actions/runs/'+os.environ['RX_CI_RUN'])
              if run['head_sha'] != os.environ['RX_SOURCE_SHA'] or run['path'] != '.github/workflows/redxai-ios-ci.yml':
                  raise SystemExit('CI identity does not match pinned release source.')
              if run['status']=='completed': break
              print('Waiting for native test gate: '+run['status'],flush=True)
              time.sleep(20)
          if run['status']!='completed' or run['conclusion']!='success':
              raise SystemExit('Native tests are not green; signing and upload are blocked.')
          jobs=get('/actions/runs/'+os.environ['RX_CI_RUN']+'/jobs?filter=latest&per_page=100')['jobs']
          required={'Build Database for simulator','Build Host compatibility check','Run shared core and storage tests','Run native Database UI smoke tests'}
          passed={s['name'] for j in jobs if j['conclusion']=='success' for s in j['steps'] if s['conclusion']=='success'}
          if not required.issubset(passed): raise SystemExit('A required test gate is missing.')
          print('VERIFIED SOURCE '+os.environ['RX_SOURCE_SHA']+' CI '+os.environ['RX_CI_RUN'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Exact-source native builds, core tests and create/edit/save/relaunch UI tests passed.\n')
          PY
  database:
    needs: verify-source
    runs-on: macos-15
    timeout-minutes: 45
    environment: Apple/AndroidAccsess
    env:
      APPLE_TEAM_ID: NZPU8H843J
      ASC_KEY_ID: 8L986HWCXB
      ASC_ISSUER_ID: af0c0450-10f2-4027-b34d-5356dfc53f5c
      SELECTED_APP: database
    steps:
      - name: Checkout the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RX_SOURCE_SHA }}
          persist-credentials: false
      - name: Set version and select stable Xcode
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RX_SOURCE_SHA"
          echo "RX_BUILD_NUMBER=$((4000 + GITHUB_RUN_NUMBER)).$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          python3 <<'PY'
          import glob,plistlib,os,re
          candidates=[]
          for path in glob.glob('/Applications/Xcode*.app'):
              if 'beta' in path.lower(): continue
              try:
                  with open(path+'/Contents/Info.plist','rb') as f: version=str(plistlib.load(f)['CFBundleShortVersionString'])
                  if re.fullmatch(r'\d+(\.\d+)*',version) and int(version.split('.')[0])>=26:
                      candidates.append((tuple(map(int,version.split('.'))),path))
              except (OSError,KeyError,ValueError): pass
          if not candidates: raise SystemExit('Stable Xcode 26+ is required.')
          selected=max(candidates)[1]+'/Contents/Developer'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DEVELOPER_DIR='+selected+'\n')
          print('Selected '+selected)
          PY
      - name: Generate project
        working-directory: ios
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK%%.*}" -ge 26
          brew install xcodegen
          xcodegen generate
      - name: Prepare protected Apple key
        env:
          PRIVATE_KEY_INPUT: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          node --input-type=module <<'NODE'
          import {createPrivateKey} from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          try {
            let value=(process.env.PRIVATE_KEY_INPUT||'').trim();
            if(!value || value.length>65536) throw Error();
            try { const j=JSON.parse(value); value=typeof j==='string'?j:(j.private_key||j.key||value); } catch {}
            value=value.replace(/^\uFEFF/,'').replace(/\\r\\n/g,'\n').replace(/\\n/g,'\n').replace(/\r\n/g,'\n');
            if(!value.includes('-----BEGIN')) value=Buffer.from(value.replace(/\s/g,''),'base64').toString('utf8');
            const key=createPrivateKey(value);
            if(key.asymmetricKeyType!=='ec'||key.asymmetricKeyDetails?.namedCurve!=='prime256v1') throw Error();
            const dir=path.join(process.env.RUNNER_TEMP,'asc');
            fs.mkdirSync(dir,{recursive:true,mode:0o700});
            fs.writeFileSync(path.join(dir,`AuthKey_${process.env.ASC_KEY_ID}.p8`),key.export({type:'pkcs8',format:'pem'}),{mode:0o600});
            console.log('Protected Apple key validated without logging its contents.');
          } catch { console.error('::error::APPLE_PRIVATE_KEY_INVALID'); process.exitCode=1; }
          NODE
      - name: Prepare temporary App Store signing
        run: |
          node scripts/redxai/ios_ephemeral_signing.mjs prepare
          openssl x509 -inform DER -in "$RUNNER_TEMP/signing/distribution.cer" -out "$RUNNER_TEMP/signing/distribution.pem"
          security create-keychain -p redxai-ci "$RUNNER_TEMP/redxai-ci.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/redxai-ci.keychain-db"
          security unlock-keychain -p redxai-ci "$RUNNER_TEMP/redxai-ci.keychain-db"
          security import "$RUNNER_TEMP/signing/distribution.key" -k "$RUNNER_TEMP/redxai-ci.keychain-db" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/signing/distribution.pem" -k "$RUNNER_TEMP/redxai-ci.keychain-db" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$RUNNER_TEMP/redxai-ci.keychain-db" login.keychain-db
          security default-keychain -d user -s "$RUNNER_TEMP/redxai-ci.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k redxai-ci "$RUNNER_TEMP/redxai-ci.keychain-db" >/dev/null
      - name: Archive Database for physical iPhones and iPads
        working-directory: ios
        run: |
          if xcodebuild -quiet -project RedXAIiOS.xcodeproj -scheme RedXAIDatabase -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$RX_PROFILE_NAME" CURRENT_PROJECT_VERSION="$RX_BUILD_NUMBER" archive > "$RUNNER_TEMP/archive.log" 2>&1; then
            echo 'Physical-device archive succeeded.'
          else
            tail -100 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
      - name: Verify archive identity and export options
        run: |
          python3 <<'PY'
          import glob,os,plistlib
          paths=glob.glob(os.environ['RUNNER_TEMP']+'/app.xcarchive/Products/Applications/*.app/Info.plist')
          if len(paths)!=1: raise SystemExit('Expected exactly one app archive.')
          with open(paths[0],'rb') as f: app=plistlib.load(f)
          expected={'CFBundleIdentifier':'com.redxai.database','CFBundleShortVersionString':os.environ['RX_EXPECTED_VERSION'],'CFBundleVersion':os.environ['RX_BUILD_NUMBER']}
          for key,value in expected.items():
              if str(app.get(key,''))!=value: raise SystemExit('Archive mismatch: '+key)
          options={'method':'app-store-connect','destination':'upload','signingStyle':'manual','signingCertificate':'Apple Distribution','teamID':os.environ['APPLE_TEAM_ID'],'uploadSymbols':True,'manageAppVersionAndBuildNumber':False,'provisioningProfiles':{'com.redxai.database':os.environ['RX_PROFILE_NAME']}}
          with open(os.environ['RUNNER_TEMP']+'/ExportOptions.plist','wb') as f: plistlib.dump(options,f)
          print('Verified archive:',expected)
          PY
      - name: Upload Database 0.4.0 to App Store Connect
        run: |
          if xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/upload.log" 2>&1; then
            tail -20 "$RUNNER_TEMP/upload.log"
          else
            tail -80 "$RUNNER_TEMP/upload.log"
            exit 1
          fi
      - name: Verify Apple processing and attach to the existing internal tester group
        timeout-minutes: 17
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createPrivateKey,sign} from 'node:crypto';
          import {setTimeout as sleep} from 'node:timers/promises';
          const base='https://api.appstoreconnect.apple.com';
          const enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          const report={bundleId:'com.redxai.database',version:process.env.RX_EXPECTED_VERSION,build:process.env.RX_BUILD_NUMBER,available:false};
          try {
            const key=createPrivateKey(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'asc',`AuthKey_${process.env.ASC_KEY_ID}.p8`),'utf8'));
            async function api(method,route,body) {
              const url=new URL(route,base);
              if(url.origin!==base) throw Error('UNEXPECTED_API_ORIGIN');
              const now=Math.floor(Date.now()/1000);
              const raw=`${enc({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'})}.${enc({iss:process.env.ASC_ISSUER_ID,iat:now-5,exp:now+115,aud:'appstoreconnect-v1'})}`;
              const jwt=`${raw}.${sign('sha256',Buffer.from(raw),{key,dsaEncoding:'ieee-p1363'}).toString('base64url')}`;
              const response=await fetch(url,{method,headers:{Authorization:`Bearer ${jwt}`,Accept:'application/json',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,redirect:'error',signal:AbortSignal.timeout(30000)});
              if(!response.ok) throw Error(`APPLE_HTTP_${response.status}_${url.pathname}`);
              return response.status===204?null:response.json();
            }
            async function all(route) {
              const data=[];
              for(let page=0;route&&page<20;page++) { const result=await api('GET',route); data.push(...(result.data||[])); route=result.links?.next; }
              if(route) throw Error('APPLE_PAGINATION_LIMIT');
              return data;
            }
            const apps=await all('/v1/apps?filter%5BbundleId%5D=com.redxai.database&limit=5');
            const app=apps.find(a=>a.attributes.bundleId===report.bundleId);
            if(!app) throw Error('APPLE_APP_NOT_FOUND');
            report.appId=app.id;
            let build, related=[];
            for(let attempt=0;attempt<40;attempt++) {
              const query=new URLSearchParams({'filter[app]':app.id,'filter[version]':report.build,include:'preReleaseVersion,buildBetaDetail',limit:'20'});
              const result=await api('GET','/v1/builds?'+query);
              build=result.data?.find(b=>b.attributes.version===report.build);
              related=result.included||[];
              report.processing=build?.attributes.processingState||'NOT_VISIBLE_YET';
              console.log('Apple processing: '+report.processing);
              if(report.processing==='VALID') break;
              if(['FAILED','INVALID'].includes(report.processing)) throw Error('APPLE_BUILD_PROCESSING_FAILED');
              await sleep(20000);
            }
            if(!build||report.processing!=='VALID') throw Error('APPLE_PROCESSING_NOT_FINISHED');
            if(build.attributes.expired) throw Error('APPLE_BUILD_EXPIRED');
            const version=related.find(v=>v.type==='preReleaseVersions'&&v.id===build.relationships.preReleaseVersion.data.id);
            if(version?.attributes.version!==report.version) throw Error('APPLE_VERSION_MISMATCH');
            report.buildId=build.id;
            const notes='Database 0.4.0 local workspace beta: create/import/rename/duplicate/export .Red-XAI databases; nested Boxes, Packers, arrays/tables and syntax colors; structured editing, search, autosave, revision history, Trash/recovery and editor themes. Test create → add/edit Packer → save → close/reopen, then export/import and restore a revision. This build does not provide hosted accounts, remote API keys or network hosting. Back up important beta files before upgrading.';
            const localizations=await all(`/v1/builds/${build.id}/betaBuildLocalizations?limit=100`);
            const existing=localizations.find(l=>l.attributes.locale==='en-US');
            if(existing) await api('PATCH',`/v1/betaBuildLocalizations/${existing.id}`,{data:{type:'betaBuildLocalizations',id:existing.id,attributes:{whatsNew:notes}}});
            else await api('POST','/v1/betaBuildLocalizations',{data:{type:'betaBuildLocalizations',attributes:{locale:'en-US',whatsNew:notes},relationships:{build:{data:{type:'builds',id:build.id}}}}});
            const groups=await all(`/v1/apps/${app.id}/betaGroups?limit=200`);
            const matching=[];
            for(const group of groups.filter(g=>g.attributes.isInternalGroup)) {
              const testers=await all(`/v1/betaGroups/${group.id}/betaTesters?limit=200`);
              if(testers.some(t=>t.attributes.email?.toLowerCase()==='redxdevelopment1998@gmail.com')) matching.push(group);
            }
            report.requestedTesterInInternalGroup=matching.length>0;
            if(!matching.length) throw Error('REQUESTED_TESTER_INTERNAL_GROUP_NOT_FOUND');
            for(const group of matching) {
              let assigned=await all(`/v1/betaGroups/${group.id}/builds?limit=200`);
              if(!assigned.some(b=>b.id===build.id)) await api('POST',`/v1/betaGroups/${group.id}/relationships/builds`,{data:[{type:'builds',id:build.id}]});
              assigned=await all(`/v1/betaGroups/${group.id}/builds?limit=200`);
              if(!assigned.some(b=>b.id===build.id)) throw Error('BUILD_GROUP_ASSIGNMENT_NOT_CONFIRMED');
            }
            report.assignedInternalGroupCount=matching.length;
            for(let attempt=0;attempt<8;attempt++) {
              const result=await api('GET',`/v1/builds/${build.id}?include=buildBetaDetail`);
              report.internalState=result.included?.find(v=>v.type==='buildBetaDetails')?.attributes.internalBuildState;
              if(report.internalState==='IN_BETA_TESTING') break;
              await sleep(10000);
            }
            report.available=report.internalState==='IN_BETA_TESTING';
            if(!report.available) throw Error('APPLE_INTERNAL_TESTING_STATE_NOT_READY');
          } catch(error) {
            const message=String(error.message||'');
            report.blocker=/^(APPLE_|REQUESTED_|BUILD_|UNEXPECTED_)/.test(message)?message:'APPLE_AVAILABILITY_CHECK_FAILED';
            process.exitCode=1;
          } finally {
            console.log('DATABASE_TESTFLIGHT_STATUS '+JSON.stringify(report));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Database TestFlight status\n\n```json\n'+JSON.stringify(report,null,2)+'\n```\n');
          }
          NODE
      - name: Revoke only this run's temporary App Store signing resources
        if: always()
        run: node scripts/redxai/ios_ephemeral_signing.mjs cleanup || true
      - name: Remove local private keys and temporary build files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/redxai-ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/signing" "$RUNNER_TEMP/app.xcarchive" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/redxai-signing-state.json" "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/upload.log"
