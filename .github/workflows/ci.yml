name: RedXAIHost CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website/red-xai.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/red-xai.com/package-lock.json
      - name: Install pinned website dependencies
        run: npm ci --ignore-scripts --workspaces=false
      - name: Website, gateway, native storage and real raster codec tests
        run: npm test
      - name: Preserved registration completion and legacy frontend integration
        run: node --test ../../scripts/primary-account-landing.test.cjs ../../scripts/primary-account-activation.test.cjs ../../scripts/primary-native-navigation.test.cjs ../../scripts/primary-host-vendor-surface.test.cjs
      - name: Origin index staging and Linux atomic application
        run: python3 -B ../../scripts/test_stage_host_origin_index.py -v
      - name: Native durability observation resolution
        run: python3 -B ../../scripts/test_native_durability_evidence.py -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/checkout@v4
        with:
          repository: grimvirusoffical-source/RedX
          ref: 8512e1704e589d24535e08082c3ab9f832d7655d
          path: .native-redx
          persist-credentials: false
      - name: Native RedX CMS round trip, restart and isolated offline restore
        run: node native-cms-integration.mjs "${{ github.workspace }}/.native-redx"
      - name: Native RedX default group durability, restart and isolated offline restore
        run: node native-cms-integration.mjs "${{ github.workspace }}/.native-redx" group-default
      - name: Audit website production dependencies
        run: npm audit --omit=dev --audit-level=high --workspaces=false
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Account and tenant integration tests
        run: bun test packages/web/src/api
      - name: Non-destructive legacy migration tests
        run: python3 -m unittest discover -s scripts -p test_stage_database.py -v
      - name: Website routing compatibility tests
        run: node --test scripts/website-gateway.test.mjs
      - name: Mounted sign-in, private owner setup and embedded workspace tests
        run: bun test packages/web/tests/mounted-auth.test.ts packages/web/tests/site-embed.test.mjs
      - name: Build
        run: bun run build
      - name: Validate self-hosted InfectedNation service
        run: bun build services/infectednation/server.ts --target=bun --outfile=/tmp/infectednation.js
      - name: End-to-end self-host smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/redxaihost-smoke
          cp .env.template .env
          cat >> .env <<'EOF'
          REDX_DATA_DIR=/tmp/redxaihost-smoke
          REDX_AUTO_LOCAL_NODE=true
          REDX_BOOTSTRAP_INFECTEDNATION=true
          REDX_BIND_HOST=127.0.0.1
          REDX_PUBLIC_URL=
          WEBSITE_URL=http://127.0.0.1:4200
          VITE_WEBSITE_URL=http://127.0.0.1:4200
          EOF
          bun scripts/selfhost.mjs --prepare
          bun --env-file=.env packages/web/src/__server.ts >/tmp/redxaihost-panel.log 2>&1 &
          PANEL_PID=$!
          trap 'kill $PANEL_PID 2>/dev/null || true; pkill -f redxaihost-local-agent.mjs 2>/dev/null || true; pkill -f "services/infectednation/server.ts" 2>/dev/null || true' EXIT

          panel_ok=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4200/api/health >/tmp/redx-panel-health.json; then panel_ok=1; break; fi
            sleep 1
          done
          if [ "$panel_ok" != 1 ]; then
            echo "RedXAIHost control plane failed to start"
            cat /tmp/redxaihost-panel.log
            exit 1
          fi

          nation_ok=0
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/infectednation-health.json; then nation_ok=1; break; fi
            sleep 1
          done
          if [ "$nation_ok" != 1 ]; then
            echo "RedXAIHost did not deploy InfectedNation through its local worker"
            cat /tmp/redxaihost-panel.log
            exit 1
          fi

          grep -q '"ok":true' /tmp/infectednation-health.json
          grep -q '"InfectedNation"' /tmp/infectednation-health.json
          echo "RedXAIHost control plane and hosted InfectedNation are healthy."
      - name: Mounted website runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          cat >> .env <<'EOF'
          REDX_BASE_PATH=/host
          VITE_BASE_PATH=/host
          REDX_PUBLIC_URL=https://red-xai.test/host
          WEBSITE_URL=https://red-xai.test/host
          VITE_WEBSITE_URL=https://red-xai.test/host
          REDX_AUTO_LOCAL_NODE=false
          REDX_ALLOW_OWNER_BOOTSTRAP=false
          DATABASE_URL=file:/tmp/redx-mounted-runtime.db
          EOF
          bun run db:push
          bun run build:web
          PORT=14200 REDX_AUTO_LOCAL_NODE=false REDX_ALLOW_OWNER_BOOTSTRAP=false bun --env-file=.env packages/web/src/__server.ts >/tmp/redx-mounted-runtime.log 2>&1 &
          MOUNT_PID=$!
          trap 'kill $MOUNT_PID 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:14200/host/api/health >/tmp/redx-mounted-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/redx-mounted-runtime.log; exit 1; fi
          curl -fsS http://127.0.0.1:14200/host >/tmp/redx-mounted-index.html
          grep -q '/host/assets/' /tmp/redx-mounted-index.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:14200/api/health)" = 404
          curl -fsS http://127.0.0.1:14200/host/api/auth/get-session -H 'Origin: https://red-xai.test' >/tmp/redx-mounted-session.json
          grep -q null /tmp/redx-mounted-session.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:14200/host/api/auth/sign-up/email -H 'Origin: https://red-xai.test' -H 'Content-Type: application/json' --data '{"email":"owner@example.invalid","password":"Synthetic-test-only-42!","name":"Fixture"}')" = 403
          echo "Mounted Host serves its own assets/auth paths and leaves legacy API paths unclaimed."
