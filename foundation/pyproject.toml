[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "red-xai-foundation"
version = "0.2.0"
description = "Local-first Red-XAI database, native desktop clients, and signed package preview"
requires-python = ">=3.11"
dependencies = ["argon2-cffi==25.1.0", "cryptography==46.0.4", "psutil==7.2.2"]

[project.scripts]
redxai = "redxai.desktop:main"
redxai-service = "redxai.service:main"

[tool.setuptools.packages.find]
include = ["redxai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
