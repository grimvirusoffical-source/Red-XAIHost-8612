name: RedXAIiOS
options:
  bundleIdPrefix: com.redxai
  deploymentTarget: { iOS: "17.0" }
  preGenCommand: python3 tools/prepare_app_icons.py
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 2100
    MARKETING_VERSION: 0.3.0
targets:
  RedXAICore:
    type: framework
    platform: iOS
    sources: [Shared]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: com.redxai.core, GENERATE_INFOPLIST_FILE: YES, CODE_SIGNING_ALLOWED: NO }
  RedXAIDatabase:
    type: application
    platform: iOS
    sources: [Database]
    dependencies: [{ target: RedXAICore }]
    info:
      path: Database/Info.plist
      properties:
        CFBundleDisplayName: Red-XAI Database
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.redxai.database
            UTTypeDescription: Red-XAI Database
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: { public.filename-extension: [Red-XAI] }
        CFBundleDocumentTypes:
          - CFBundleTypeName: Red-XAI Database
            LSHandlerRank: Owner
            LSItemContentTypes: [com.redxai.database]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redxai.database
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RedXAIHost:
    type: application
    platform: iOS
    sources: [Host]
    dependencies: [{ target: RedXAICore }]
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: Red-XAI Host
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Red-XAI Host discovers and pairs with Red-XAI nodes you approve on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redxai.host
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RedXAICoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: RedXAICore }]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: com.redxai.coretests }
schemes:
  RedXAIDatabase:
    build: { targets: { RedXAIDatabase: all, RedXAICoreTests: [test] } }
    test: { targets: [RedXAICoreTests] }
  RedXAIHost:
    build: { targets: { RedXAIHost: all, RedXAICoreTests: [test] } }
    test: { targets: [RedXAICoreTests] }
